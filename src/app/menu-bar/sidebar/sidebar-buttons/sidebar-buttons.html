<div class="sidebar-buttons">
  <a 
    routerLink=""
    routerLinkActive="active-link" 
    [routerLinkActiveOptions]="{ exact: true }"
    pTooltip="home">    
    <button pButton pRipple>
      <i class="pi pi-home sidebar__icon"></i>
    </button>
  </a>
  <a
    routerLink="/pokemon"
    routerLinkActive="active-link"
    pTooltip="pokedex">
    <button pButton pRipple class="p-button--active">
      <i class="pi pi-list sidebar__icon"></i>
    </button>
  </a>
  <a 
    routerLink="/compare"
    routerLinkActive="active-link"
    pTooltip="compare">
    <button pButton pRipple>
      <i class="pi pi-search sidebar__icon"></i>
    </button>
  </a>
  <a 
    [routerLink]="['..']"
    pTooltip="return"
  >
    <button pButton pRipple>
      <i class="pi pi-arrow-left sidebar__icon"></i>
    </button>
  </a>
</div>
