<div class="pokemon-page">
  <a routerLink="/pokemon">
    <p-button><i class="pi pi-undo"></i>return</p-button>
  </a>
  @if (pokemonPageState.currentPokemon(); as pokemon) {
    <app-pokemon-card [pokemon]="pokemon" />
  } @else {
    <p-skeleton class="pokemon-card__skeleton" width="65%" height="22rem" />
  }
  <app-forward-back-buttons-layout />
</div>
