@if (!isSkeleton()) {
  <div class="pokemon-board-grid">
    <div class="block block-1"><app-board-module moduleType="pokemon-card" /></div>
    <div class="block block-2"><app-board-module moduleType="pokemon-stats" /></div>
    <div class="block block-3"><app-board-module moduleType="pokemon-index" /></div>
    <div class="block block-4"><app-board-module moduleType="pokemon-evolution" /></div>
  </div>
} @else {
  <div class="pokemon-board-grid">
    <div class="block block-1">
      <p-skeleton width="100%" height="100%" />
    </div>
    <div class="block block-2">
      <p-skeleton width="100%" height="10rem" />
    </div>
    <div class="block block-3">
      <p-skeleton width="100%" height="100%" />
    </div>
    <div class="block block-4">
      <p-skeleton width="100%" height="20rem" />
    </div>
  </div>
}
