<div class="board-module">
  @switch (moduleType()) {
    @case ("pokemon-card") {
      <app-pokemon-card-module />
    }
    @case ("pokemon-stats") {
      <app-pokemon-stats-module />
    }
    @case ("pokemon-evolution") {
      <app-pokemon-evolution-module />
    }
    @case ("pokemon-index") {
      <app-pokemon-index-module />
    }
  }
</div>
