<div class="pokemon-card__info">
  <p><strong>Id:</strong> #{{ pokemon().id }}</p>
  <p>
    <strong>Types:</strong>
    <app-pokemon-types-displayer [types]="pokemon().types | displayTypes" />
  </p>
  <div class="pokemon-card__abilities-list"><strong>Abilities:</strong>
    <ul>
      @for (ability of (pokemon().abilities | displayAbilities); track $index) {
        <li>{{ ability }}</li>
      }
    </ul>
  </div>
</div>
