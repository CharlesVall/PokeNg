<div>
  <a [routerLink]="`/pokemon/${previousPokemon()?.id}`">
    <p-button>
      <i class="pi pi-arrow-left"></i>
      {{ previousPokemon()?.id }}
      <img [src]="previousPokemon()?.sprites?.front_default"/>
    </p-button>
  </a>
  <a [routerLink]="`/pokemon/${nextPokemon()?.id}`">
    <p-button>
      <img [src]="nextPokemon()?.sprites?.front_default"/>
      {{ nextPokemon()?.id }}
      <i class="pi pi-arrow-right"></i>
    </p-button>
  </a>
</div>
